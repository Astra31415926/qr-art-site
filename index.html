<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Art Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #1a1a1a; color: white; }
        .container { max-width: 500px; width: 100%; background: #2d2d2d; padding: 25px; border-radius: 15px; }
        textarea { width: 100%; height: 80px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #444; padding: 12px; box-sizing: border-box; background: #3d3d3d; color: white; resize: none; }
        button { width: 100%; padding: 14px; background: #ff4757; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #qrcode { display: none; }
        canvas { max-width: 100%; border-radius: 10px; margin-top: 20px; image-rendering: pixelated; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .info { margin-top: 10px; font-size: 0.8em; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h2>QR-Art Generator</h2>
    <textarea id="textInput" placeholder="Текст ||| Ключ"></textarea>
    <button onclick="processData()">Создать QR-Art</button>
    <div id="qrcode"></div>
    <canvas id="mainCanvas"></canvas>
    <div class="info">Синий канал = QR | Красный/Зеленый = Орнамент</div>
</div>

<script>
    const PREFIX = "*";

    function processData() {
        let input = document.getElementById('textInput').value;
        const qrContainer = document.getElementById('qrcode');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        let text = input;
        let key = "";
        if (input.includes("|||")) {
            const parts = input.split("|||");
            text = parts[0].trim();
            key = parts[1].trim();
        }

        if (!text) return alert("Введите текст!");

        let dataToEncode = text;
        if (key) {
            dataToEncode = PREFIX + CryptoJS.AES.encrypt(text, key).toString();
        }

        qrContainer.innerHTML = "";
        // Используем уровень H для максимальной выживаемости кода
        new QRCode(qrContainer, { text: dataToEncode, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.H });

        setTimeout(() => {
            const qrImg = qrContainer.querySelector('img');
            canvas.width = 256;
            canvas.height = 256;
            ctx.drawImage(qrImg, 0, 0);

            const imageData = ctx.getImageData(0, 0, 256, 256);
            const data = imageData.data;
            
            // Размер блока для орнамента (как в твоем Python коде)
            const blockSize = 16; 

            for (let y = 0; y < 256; y++) {
                for (let x = 0; x < 256; x++) {
                    const i = (y * 256 + x) * 4;
                    const isDark = data[i] < 128;

                    // Логика блоков (псевдо-орнамент)
                    const blockX = Math.floor(x / blockSize);
                    const blockY = Math.floor(y / blockSize);
                    const pattern = (blockX + blockY) % 2 === 0;

                    // R и G каналы заполняем узором
                    data[i] = pattern ? 200 : 50;      // Red канал
                    data[i+1] = (blockX * 10) % 255;   // Green канал
                    
                    // B канал — строго наш QR
                    data[i+2] = isDark ? 0 : 255;      // Blue канал
                    
                    data[i+3] = 255; 
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }, 150);
    }
</script>

</body>
</html>
