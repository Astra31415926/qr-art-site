<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Art Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #1a1a1a; color: white; }
        .container { max-width: 500px; width: 100%; background: #2d2d2d; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        textarea, input { width: 100%; margin-bottom: 15px; border-radius: 8px; border: 1px solid #444; padding: 12px; box-sizing: border-box; background: #3d3d3d; color: white; }
        button { width: 100%; padding: 14px; background: #ff4757; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #qrcode { margin-top: 25px; background: white; padding: 15px; border-radius: 10px; display: none; justify-content: center; }
        h2 { text-align: center; color: #ff4757; }
    </style>
</head>
<body>

<div class="container">
    <h2>QR-Art Generator</h2>
    <textarea id="textInput" placeholder="Текст сообщения..."></textarea>
    <input type="text" id="keyInput" placeholder="Ключ (опционально)...">
    <button onclick="processData()">Создать QR</button>
    <div id="qrcode"></div>
</div>

<script>
    const PREFIX = "*";

    function processData() {
        const text = document.getElementById('textInput').value;
        const key = document.getElementById('keyInput').value;
        const qrContainer = document.getElementById('qrcode');

        if (!text) return alert("Введите текст!");

        let dataToEncode = text;

        if (key) {
            // Шифруем и добавляем короткий префикс *
            const encrypted = CryptoJS.AES.encrypt(text, key).toString();
            dataToEncode = PREFIX + encrypted;
        }

        qrContainer.innerHTML = "";
        qrContainer.style.display = "flex";

        new QRCode(qrContainer, {
            text: dataToEncode,
            width: 256,
            height: 256,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    }
</script>

</body>
</html>
